[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchgraph-rag"
version = "0.1.0"
description = "Multi-hop scientific RAG with hybrid retrieval, citations, API, and evaluation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Sara Feizyab"}
]
keywords = ["rag", "langgraph", "qdrant", "biomedical-ai", "retrieval"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
